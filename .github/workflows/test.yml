name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
        telethon: ["", "telethon"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: matrix.telethon
        run: pip install telethon
      - run: python skills/telegram/scripts/test_tg.py
      - run: bash scripts/package.sh && ! unzip -l dist/tg-skill.skill | grep -q '/\.env$'
